name: Enrich UN Comtrade partner names

on:
  push:
    paths:
      - ".github/workflows/enrich_partner_names.yml"
      - "scripts/enrich_partner_names.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pandas requests
      - name: Add official partner names and ISO3
        run: python scripts/enrich_partner_names.py
      - name: Commit enriched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/clean/tea_exports_2005_2024.csv
          git add -f output/tables/partner_export_ranking.csv
          git add -f output/logs/comtrade_data_quality.md
          git diff --cached --quiet || git commit -m "Enrich Comtrade partner names and ISO3 codes"
          git push
